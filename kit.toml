# agent-kit core 配置(示例值;预算数值待决策 ② 定稿,P0 只告警)

[kit]
name = "agent-kit"
version = "0.0.0"

[agents]
# 渲染目标;openclaw 默认不渲染(设计 §4.2)
enabled = ["claude", "codex", "pi", "kimi", "opencode"]

[budget]
# P1(决策 ② 落地):schema 缺省已改为 block(只作用于 documented/probed;assumed 恒只告警)。
# 真实仓库在阈值探针(probe)定稿前显式保持 warn。
enforce = "warn"
atom_max_bytes = 600
threshold_percent = 90
project_max_bytes = 16384

[budget.claude]
max_lines = 200
limit_source = "documented" # 官方建议值,非硬限

[budget.codex]
max_bytes = 16384
hard_limit = 32768
limit_source = "documented"

[budget.pi]
max_bytes = 16384
hard_limit = "unknown"
limit_source = "assumed"

[budget.kimi]
max_bytes = 16384
hard_limit = "unknown"
limit_source = "assumed"

[budget.opencode]
max_bytes = 16384
hard_limit = "unknown"
limit_source = "assumed"

# 渠道成员表按渠道登记(设计 §5.3)。P0 只做 schema 校验,不使用。
[channels.canary.members]

[channels.stable.members]
