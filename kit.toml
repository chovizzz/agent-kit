# agent-kit core 配置(示例值)

[kit]
name = "agent-kit"
version = "0.1.0-rc.0"

[agents]
# 渲染目标;openclaw 默认不渲染(设计 §4.2)
enabled = ["claude", "codex", "pi", "kimi", "opencode"]

[budget]
# 决策 ② 收口(D2):P0 期间显式保持 warn;阈值探针(probe)定稿后收紧为 block,与 schema 缺省一致。
# block 只作用于 documented/probed 目标;assumed 恒只告警(设计 §3.6)。
enforce = "block"
atom_max_bytes = 600
threshold_percent = 90
project_max_bytes = 16384

[budget.claude]
max_lines = 200
limit_source = "documented" # 官方建议值,非硬限

[budget.codex]
max_bytes = 16384
hard_limit = 32768
limit_source = "documented"

[budget.pi]
max_bytes = 16384
hard_limit = "unknown"
limit_source = "assumed"

[budget.kimi]
max_bytes = 16384
hard_limit = "unknown"
limit_source = "assumed"

[budget.opencode]
max_bytes = 16384
hard_limit = "unknown"
limit_source = "assumed"

# 晋升/退役判据阈值(L0 追加,④A 保守默认)。每项的 schema 下界就是这里的值:只能调严,不能调松。
# 覆盖层(kit.overlay.toml)不接受本段。
[lifecycle]
canary_window_days = 14
min_members = 2
min_non_owner_members = 1
min_exposure_sessions = 10
max_harmful = 0
no_exposure_windows = 2

# 渠道成员表按渠道登记(设计 §5.3)。P0 只做 schema 校验,不使用。
[channels.canary.members]

[channels.stable.members]
