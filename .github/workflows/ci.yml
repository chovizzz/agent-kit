# P0 CI:只写文件,P0 不要求在远端跑通(推到远端后由主代理观察一次)。
# 约束:最小权限、无 secrets、不用 pull_request_target、actions 全部按提交 SHA 钉版(行尾注释写对应标签)。
# 不跑 A5(读真实 HOME)、A6/A7(需要真实会话文件与本机盘点来源)、A12(本工作流自身就是干净环境)、A13(人工完成项)。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile, no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: agent-kit check
        run: node dist/cli.js check

      # A1 / A2 / A4 对应的 vitest 单独再跑一遍,失败时一眼能看出是哪一项
      - name: A2 budget matrix (vitest)
        run: pnpm exec vitest run test/budget

      - name: A4 merge and guard fixtures (vitest)
        run: pnpm exec vitest run test/merge test/guards

      - name: A1 determinism (vitest)
        run: pnpm exec vitest run test/render-core test/golden

      # 真实验收脚本:任何非零(含 4=未执行)都让本步骤失败。A1/A8/A15 在 build 接线(B19)前会因命令桩得到 4。
      - name: Acceptance scripts (A1 A2 A3 A4 A8 A9 A10 A14 A15)
        run: ops/accept-p0.sh --only A1,A2,A3,A4,A8,A9,A10,A14,A15

  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile, no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # A11:精确版本、lockfile 入库、audit(需要网络,失败即 4 => 步骤失败)、许可证清单
      - name: A11 supply chain
        run: ops/accept-p0.sh --only A11
