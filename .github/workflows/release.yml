# P1-D 发布:tag 触发 → 全门禁 → `npm publish`(GitHub Actions,无需本地 otp)。
#
# 约束与 ci.yml 一致:最小权限、actions 按提交 SHA 钉版、不用 pull_request_target。
# 唯一的 secrets 是 `NPM_TOKEN`(npm Automation/Granular token,需对 `@chovizzz` scope 有发布权)。
#
# 发布前置:
#   1. `pnpm run check:publish -- --tag <tag>` 通过(包内容白名单 + 禁运形态 + tag/version 一致);
#   2. 全门禁(typecheck/build/test/lint/format:check)与 `node dist/cli.js check` 通过;
#   3. tag 形如 `vX.Y.Z` 且与 package.json 的 version 逐字一致。
#
# 不做的事:不自动打 tag(打 tag 是人的决定)、不推分支、不创建 release notes。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm provenance(公开仓库 + OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install (frozen lockfile, no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (tsc typecheck/emit + vite bundle into dist + THIRD_PARTY_LICENSES)
        run: pnpm run build

      - name: Test
        # 测试需要仓库外的 KIT_TMP(假二进制/临时仓库放这里);本机由人手设置,CI 在这里建
        run: |
          export KIT_TMP="$(mktemp -d "${RUNNER_TEMP}/kit-tmp.XXXXXX")"
          chmod 700 "$KIT_TMP"
          pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: agent-kit check
        run: node dist/cli.js check

      - name: Build payload (prerendered rules + integrity)
        run: node scripts/build-payload.mjs

      - name: Publish preflight (package surface + payload integrity + tag/version match)
        run: node scripts/check-publish.mjs --tag "${GITHUB_REF_NAME}"

      - name: Publish to npm
        # 预发布版本(带 -rc/-next 等后缀)只进 rc 标签,绝不进 latest
        run: |
          VER="$(node -p "require('./package.json').version")"
          case "$VER" in *-*) DIST_TAG=rc ;; *) DIST_TAG=latest ;; esac
          npm publish --provenance --access public --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
