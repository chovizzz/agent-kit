# P1-D 发布:tag 触发 → 全门禁 → `npm publish`(GitHub Actions,无需本地 otp)。
#
# 约束与 ci.yml 一致:最小权限、actions 按提交 SHA 钉版、不用 pull_request_target。
# 唯一的 secrets 是 `NPM_TOKEN`(npm Automation/Granular token,需对 `@chovizzz` scope 有发布权)。
#
# 发布前置:
#   1. tag 指向的提交必须是 `origin/main` 的祖先(只发已合入主干的代码,拒绝从任意分支 / 孤儿提交打 tag 发版);
#   2. 全门禁(typecheck/build/test/lint/format:check)、`node dist/cli.js check`、与 ci.yml 同一组验收脚本(含 A11 供应链)通过;
#   3. `node scripts/check-publish.mjs --tag <tag>` 通过(包内容白名单 + 禁运形态 + payload/打包闸 + tag/version 一致);
#   4. tag 形如 `vX.Y.Z` 且与 package.json 的 version 逐字一致。
# 前置门禁失败不会尝试发布:`npm publish` 是最后一步且只有一条命令;npm 对同一版本号拒绝二次发布,不会覆盖已发布内容。
# publish 开始后若报红(如响应丢失),先 `npm view` 核对 registry 状态,再决定是否重跑,不要盲目重跑。
#
# 不做的事:不自动打 tag(打 tag 是人的决定)、不推分支、不创建 release notes。
name: release

on:
  push:
    tags:
      - 'v*'

# 工作流级只给读权限;`id-token: write`(npm provenance 的 OIDC)只授给下面的发布 job。
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 绑定 GitHub Environment `npm-publish`:可在仓库 Settings → Environments 里给它加 required reviewers
    # 与「只允许 tag 触发」的部署规则,并把 NPM_TOKEN 存成该环境的 secret(见 docs/npm-first-publish.md)。
    # 环境不存在时 GitHub 会自动创建一个无保护的空环境,不影响仓库级 secret 的读取。
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # npm provenance(公开仓库 + OIDC);仅发布 job
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must point at a commit already on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) 不在 origin/main 的历史上,拒绝发布" >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install (frozen lockfile, no lifecycle scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build (tsc typecheck/emit + vite bundle into dist + THIRD_PARTY_LICENSES)
        run: pnpm run build

      - name: Test
        # 测试需要仓库外的 KIT_TMP(假二进制/临时仓库放这里);本机由人手设置,CI 在这里建
        run: |
          export KIT_TMP="$(mktemp -d "${RUNNER_TEMP}/kit-tmp.XXXXXX")"
          chmod 700 "$KIT_TMP"
          pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: agent-kit check
        run: node dist/cli.js check

      # 与 ci.yml 同一组验收脚本(A11 需要网络做 audit;A5/A6/A7 读真实 HOME、A12/A13 属人工或干净环境项,不在 CI)
      - name: Acceptance scripts (A1 A2 A3 A4 A8 A9 A10 A11 A14 A15)
        run: ops/accept-p0.sh --only A1,A2,A3,A4,A8,A9,A10,A11,A14,A15

      - name: Acceptance scripts P1 (A18 A19 A23)
        run: ops/accept-p1.sh --only A18,A19,A23

      - name: Build payload (prerendered rules + integrity)
        run: node scripts/build-payload.mjs

      - name: Publish preflight (package surface + payload integrity + tag/version match)
        run: node scripts/check-publish.mjs --tag "${GITHUB_REF_NAME}"

      - name: Publish to npm
        # 预发布版本(带 -rc/-next 等后缀)只进 rc 标签,绝不进 latest
        run: |
          VER="$(node -p "require('./package.json').version")"
          case "$VER" in *-*) DIST_TAG=rc ;; *) DIST_TAG=latest ;; esac
          npm publish --provenance --access public --ignore-scripts --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
